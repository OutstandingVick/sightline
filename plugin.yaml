name: sightline
version: "0.4.0"
description: >-
  Solana transaction firewall for Hermes. The agent can check balances, preview and
  pay on devnet, but every payment is simulated, explained, and allowed only inside
  a grant the user issued with /sightline grant (time-boxed, capped, revocable).
  Anything else needs the user's approval or is blocked. Every decision goes to a
  hash-chained audit log. The private key never reaches the model.
author: Outstandingvick
license: MIT
homepage: https://github.com/OutstandingVick/sightline
tags: [solana, wallet, security, firewall, audit]
provides_tools:
  - sightline_status
  - sightline_balance
  - sightline_preview
  - sightline_pay
provides_hooks:
  - pre_tool_call
requires_env:
  - name: SIGHTLINE_SECRET_KEY
    description: "Base58-encoded Solana keypair (64-byte secret). Use a devnet wallet."
    url: "https://faucet.solana.com"
    secret: true
python_dependencies:
  - "solana>=0.36,<0.37"
  - "solders>=0.26,<0.27"
config_schema:
  rpc_url:
    type: secret
    env: SIGHTLINE_RPC_URL
    label: "Solana RPC URL"
    description: "Optional. Defaults to https://api.devnet.solana.com"
    required: false
  allow_mainnet:
    type: secret
    env: SIGHTLINE_ALLOW_MAINNET
    label: "Allow mainnet"
    description: "Optional. Set to 1 to allow a mainnet RPC. Off by default."
    required: false
